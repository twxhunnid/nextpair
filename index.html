<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Пары">
<title>Пары КС-125</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0b0b0c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3f3f4;--card:#fff;--ink:#18181a;--mut:#76767c;--line:#e2e2e5;--acc:#3d3d42;--glow:rgba(24,24,26,.22);--ok:#17925f;--no:#cc4a50;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--card:#131314;--ink:#ededee;--mut:#8a8a90;--line:#222224;--acc:#d6d6da;--glow:rgba(235,235,240,.24);--ok:#6dc29a;--no:#e0848a}}
:root[data-theme="dark"]{--bg:#0b0b0c;--card:#131314;--ink:#ededee;--mut:#8a8a90;--line:#222224;--acc:#d6d6da;--glow:rgba(235,235,240,.24);--ok:#6dc29a;--no:#e0848a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 20px 48px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:26px}
h1{font-size:14px;font-weight:500;margin:0;color:var(--mut)}
.par{font-size:13px;color:var(--mut)}
.hero{padding:20px;background:var(--card);border:1px solid var(--line);border-radius:20px;transition:border-color .2s,box-shadow .2s}
.hero small{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
.hero b{display:block;font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-.03em;text-shadow:0 0 24px var(--glow)}
.hero p{margin:10px 0 0;font-size:15px;color:var(--mut)}
.pg{height:2px;background:var(--line);margin-top:18px}
.pg span{display:block;height:100%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.tabs{display:flex;gap:8px;margin:14px 0 6px}
.tabs button{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--mut);font:500 13px Onest,system-ui,sans-serif;padding:11px 2px;border-radius:12px;transition:border-color .2s,box-shadow .2s,color .2s}
#tabs button{flex:1 1 auto}
.tabs button.on{color:var(--ink);border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 16px -4px var(--glow)}
.day{margin:22px 0 2px;font-size:13px;color:var(--mut)}
.dh{display:flex;flex-wrap:wrap;row-gap:6px;align-items:baseline;gap:10px;margin:34px 0 4px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.dh b{white-space:nowrap;font-size:18px;font-weight:700;letter-spacing:-.01em}
.dh b::before{content:"";display:inline-block;width:6px;height:6px;margin-right:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);vertical-align:middle}
.dh span{white-space:nowrap;font-size:13px;color:var(--mut)}
.dh em{margin-left:auto;font-style:normal;font-size:12px;color:var(--acc);border:1px solid var(--acc);border-radius:10px;padding:2px 9px;box-shadow:0 0 10px -4px var(--acc)}
.les{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:14px 0 14px 12px;border-bottom:1px solid var(--line);border-left:2px solid transparent}
.les.now{border-left-color:var(--acc);box-shadow:-10px 0 16px -12px var(--acc)}
.les.past{opacity:.5}
.t{font-size:13px;color:var(--mut);line-height:1.25}
.t i{display:block;font-style:normal;color:var(--ink);font-weight:500;font-size:15px}
.n{font-weight:500;overflow-wrap:anywhere}
.nw,.r{white-space:nowrap}
.r{font-size:13px;color:var(--mut)}
.mk{display:flex;gap:6px}
.mk button{border:1px solid var(--line);background:none;color:var(--mut);border-radius:10px;font:500 13px Onest,system-ui,sans-serif;padding:6px 10px}
.mk .p.on{border-color:var(--ok);color:var(--ok);box-shadow:0 0 10px -3px var(--ok)}
.mk .a.on{border-color:var(--no);color:var(--no);box-shadow:0 0 10px -3px var(--no)}
.lf{display:grid;gap:10px}
.lf .day{margin:6px 0 0}
.rem{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mut)}
input[type=checkbox]{flex:none;width:18px;height:18px;padding:0;accent-color:var(--acc)}
.save:disabled{opacity:.5}
.upd{font-size:12px;color:var(--mut);margin-top:14px;opacity:.8}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:10px 0 4px}
.cal i{display:block}
.cd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-family:Onest,system-ui,sans-serif;transition:border-color .2s,box-shadow .2s}
.cd b{font-size:15px;font-weight:500;line-height:1.2}
.cd small{font-size:10px;color:var(--mut);line-height:1}
.cd:disabled{opacity:.3}
.cd.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 14px -4px var(--glow)}
.cd.ov b::after{content:"";display:inline-block;width:4px;height:4px;margin-left:2px;border-radius:50%;background:var(--acc);vertical-align:super}
.dh em.rp+em{margin-left:0}
@media (hover:hover){.cd:not(:disabled):hover{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 14px -4px var(--glow)}}
.nb{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:10px;padding:6px 10px;font:500 12px Onest,system-ui,sans-serif;white-space:nowrap;transition:border-color .2s,box-shadow .2s}
.nb .s,.nb .p{display:none}
@media (max-width:430px){.nb .l{display:none}.nb .s{display:inline}}
@media (max-width:340px){.nb .s{display:none}.nb .p{display:inline;font-size:14px;line-height:1}.nb{padding:5px 11px}}
@media (hover:hover){.nb:hover{border-color:var(--acc);color:var(--ink);box-shadow:0 0 0 1px var(--acc),0 0 14px -4px var(--glow)}}
.nts{grid-column:2/-1;display:grid;gap:6px;margin-top:8px}
.nt{display:flex;gap:8px;align-items:baseline;font-size:13px;border-left:2px solid var(--line);padding-left:8px}
.nk{color:var(--mut);font-size:12px;white-space:nowrap}
.nx{flex:1;min-width:0;overflow-wrap:anywhere}
.nd{border:0;background:none;color:var(--mut);font-size:16px;line-height:1;padding:0 2px}
.nf{display:grid;gap:8px;margin-top:4px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:10px;padding:7px 4px;font:500 13px Onest,system-ui,sans-serif}
.seg button.on{color:var(--ink);border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 12px -4px var(--glow)}
select{width:100%;min-width:0;font:400 16px Onest,system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.nrow{display:flex;gap:8px}
.nrow .cp{margin:0}
.toast{position:fixed;left:16px;right:16px;max-width:488px;margin:0 auto;top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:12px 14px;font-size:14px;box-shadow:0 0 22px -6px var(--glow);opacity:0;pointer-events:none;transform:translateY(-8px);transition:opacity .2s,transform .2s;z-index:20}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.brk{font-size:12px;color:var(--mut);padding:8px 0 8px 76px;border-bottom:1px solid var(--line)}
.info{font-size:13px;color:var(--mut);padding:10px 0 2px}
.empty{color:var(--mut);padding:16px 0;font-size:14px}
.nav{display:flex;justify-content:space-between;align-items:center;margin:8px 0 0}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:7px 16px;font:500 14px Onest,system-ui,sans-serif;transition:border-color .2s,box-shadow .2s}
.cp{justify-self:start;margin-top:4px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:12px;padding:7px 12px;font:500 13px Onest,system-ui,sans-serif;transition:border-color .2s,box-shadow .2s}
.save{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px;font:500 15px Onest,system-ui,sans-serif;transition:border-color .2s,box-shadow .2s}
.nav button:disabled{opacity:.3}
.st{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.bar{grid-column:1/3;height:2px;background:var(--line);margin-top:8px}
.bar span{display:block;height:100%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
input{font:400 16px Onest,system-ui,sans-serif;color:var(--ink);background:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;flex:1}
@media (hover:hover){.hero:hover,.tabs button:hover,.nav button:not(:disabled):hover,.save:hover,.cp:hover{border-color:var(--acc);color:var(--ink);box-shadow:0 0 0 1px var(--acc),0 0 22px -4px var(--glow)}}
.tabs button:active,.nav button:not(:disabled):active,.save:active,.cp:active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 22px -4px var(--glow)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
<header><h1>КС-125</h1><span class="par" id="par"></span></header>
<section class="hero" id="hero"></section>
<nav class="tabs" id="tabs"></nav>
<div id="view"></div>
<div id="toast" class="toast" role="status"></div>
<div id="foot" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:26px"><button class="cp" id="lg" data-ed="loginview">Вход для редактора</button></div>
<div class="upd" id="upd"></div>
</main>
<script>
const SB_URL="PASTE_SUPABASE_URL",SB_KEY="PASTE_SUPABASE_ANON_KEY";
const DEMO=SB_URL.startsWith("PASTE");
const OS=["ОС и среды","407"],MDK=["МДК.03.01","306"],VM=["Высш. математика","204"],OAP=["ОАП","407"],DM=["Дискр. математика","407"],FK=["Физкультура","С/З"],IG1=["Инж. графика 1","201"],IG2=["Инж. графика 2","201"],MET=["Метрология","110"],BZH=["БЖ","205"],IST=["История России","105"],IY=["Ин. язык","104"],IY4=["Ин. язык","40"],EL=["Электротехника","301"];
// день -> 5 пар, каждая [чётная, нечётная]
let S;const S0={1:[[0,OS],[MDK,VM],[VM,MDK],[OAP,OAP],[0,0]],2:[[0,0],[FK,FK],[OAP,DM],[OS,OS],[IY,IY]],3:[[IG1,IG1],[MET,MET],[BZH,BZH],[IST,IST],[IG2,IG2]],4:[[IST,0],[DM,DM],[VM,VM],[IY4,IY4],[0,0]],5:[[DM,DM],[OS,OAP],[EL,MDK],[EL,MDK],[0,0]]};
S=S0;try{const c=localStorage.getItem("S");if(c)S=JSON.parse(c)}catch(e){}let O={};try{const c=localStorage.getItem("O");if(c)O=JSON.parse(c)}catch(e){}const TM={1:[["9:00","10:20"],["10:40","12:00"],["12:20","13:40"],["14:00","15:20"],["15:40","17:00"]],o:[["8:00","9:20"],["9:50","11:10"],["11:40","13:00"],["13:30","14:50"],["15:20","16:40"]]};
const DN=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const MS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const REF=new Date(2026,9,26); // понедельник чётной недели
const pad=n=>String(n).padStart(2,"0");
const dk=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const mon=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const isEven=d=>{const w=Math.round((mon(d)-REF)/6048e5);return ((w%2)+2)%2===0};
const at=(d,s)=>{const[h,m]=s.split(":");return new Date(d.getFullYear(),d.getMonth(),d.getDate(),+h,+m)};
function lessons(d,even){const w=d.getDay();if(!S||!S[w])return[];const tm=TM[w===1?1:"o"];if(even===undefined)even=isEven(d);
 const out=w===1?[{n:0,name:"Разговоры о важном",room:"",a:at(d,"8:00"),b:at(d,"8:45"),k:dk(d)+"|0",s:"8:00",f:"8:45"}]:[];S[w].forEach((p,i)=>{const e=O[dk(d)]?O[dk(d)][i]:p[even?0:1];if(e)out.push({n:i+1,name:e[0],room:e[1],a:at(d,tm[i][0]),b:at(d,tm[i][1]),k:dk(d)+"|"+(i+1),s:tm[i][0],f:tm[i][1]})});return out}
let att={};try{att=JSON.parse(localStorage.getItem("att")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("att",JSON.stringify(att))}catch(e){}};
const base=new Date().getDay()%6===0?1:0;let tab="today",off=base,pk=null;
const $=id=>document.getElementById(id);
const fmt=ms=>{const m=Math.max(0,Math.ceil(ms/6e4));return m>=60?Math.floor(m/60)+" ч "+(m%60?m%60+" мин":""):m+" мин"};
const hasData=()=>!!S&&typeof S==="object"&&[1,2,3,4,5].some(d=>Array.isArray(S[d])&&S[d].some(p=>Array.isArray(p)&&(p[0]||p[1])));
function hero(){const now=new Date();let cur=null,nxt=null,when="";
 if(!hasData()){$("par").textContent=(isEven(now)?"чётная":"нечётная")+" неделя";$("hero").innerHTML='<small>Расписание недоступно</small><b>Нет данных</b><p>Не удалось загрузить расписание. Попробуй обновить страницу.</p>';return}
 for(let i=0;i<14&&!nxt;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);
  for(const l of lessons(d)){if(l.a<=now&&now<l.b){cur=l}else if(l.a>now&&!nxt){nxt=l;when=i===0?"":i===1?"завтра, ":DN[d.getDay()].toLowerCase()+", "}}
  if(cur&&i===0&&nxt)break}
 let h="";
 if(cur)h=`<small>${cur.n?"Идёт "+cur.n+"-я пара":"Идёт урок"}, до ${cur.f}</small><b>${cur.name}</b><p>${cur.room?rmn(cur.room)+" · ":""}осталось ${fmt(cur.b-now)}`+(nxt&&nxt.a.toDateString()===now.toDateString()?` · дальше в ${nxt.s}`:"")+`</p><div class="pg"><span style="width:${Math.round((now-cur.a)/(cur.b-cur.a)*100)}%"></span></div>`;
 else if(nxt&&when!==""&&lessons(now).length)h=`<small>Сегодня</small><b style="font-size:28px">Пары на сегодня закончились</b><p>Следующая пара — ${when}${nxt.s}–${nxt.f} · ${nxt.name}${nxt.room?" · "+rmn(nxt.room):""}</p>`;
 else if(nxt)h=`<small>${when===""?"Следующая пара":"Сегодня пар нет · следующая пара"}</small><b>${nxt.name}</b><p>${when}${nxt.s}–${nxt.f}${nxt.room?" · "+rmn(nxt.room):""}`+(when===""?` · через ${fmt(nxt.a-now)}`:"")+"</p>";
 else h='<small>Расписание</small><b>Пар не предстоит</b><p>В ближайшие две недели занятий нет.</p>';
 $("hero").innerHTML=h;
 $("par").textContent=(isEven(now)?"чётная":"нечётная")+" неделя"}
function row(l,now){const past=l.b<now,live=l.a<=now&&now<l.b,ns=NT.filter(x=>x.k===l.k);
 return `<div class="les${live?" now":""}${past?" past":""}"><div class="t"><i>${l.s}</i>${l.f}</div><div><div class="n">${l.name}</div>${l.room?`<div class="r">каб. ${l.room}</div>`:""}</div><button class="nb" data-n="open" data-v="${l.k}" aria-label="Добавить заметку"><span class="l">Добавить заметку</span><span class="s">+ Заметка</span><span class="p">+</span></button>${notesHtml(l,ns)}</div>`}
const rmn=r=>`<span class="nw">каб. ${r}</span>`;
const hm=t=>{const d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())};
function noteForm(l){const o=[[0,"в начале пары"],[10,"за 10 минут до начала"],[30,"за 30 минут до начала"],[60,"за 1 час до начала"],[-1,"за 10 минут до конца"]];
 return `<div class="nf"><div class="seg"><button class="${nType==="n"?"on":""}" data-n="type" data-v="n">Записка</button><button class="${nType==="r"?"on":""}" data-n="type" data-v="r">Напоминание</button></div><input id="nx" value="${esc(nTxt)}" placeholder="Текст заметки" maxlength="120">`+
 (nType==="r"?`<select id="no">${o.map(x=>`<option value="${x[0]}"${x[0]===nOff?" selected":""}>${x[1]}</option>`).join("")}</select><div class="info" style="padding:0">Сработает, пока страница открыта</div>`:"")+
 `<div class="info" id="ne" style="padding:0"></div><div class="nrow"><button class="cp" data-n="save" data-v="${l.k}">Сохранить</button><button class="cp" data-n="cancel">Отмена</button></div></div>`}
function notesHtml(l,ns){if(!ns.length&&nOpen!==l.k)return"";
 return '<div class="nts">'+ns.map(x=>`<div class="nt"><span class="nk">${x.t==="r"?"напоминание · "+hm(x.at):"записка"}</span><span class="nx">${esc(x.x)}</span><button class="nd" data-n="del" data-v="${x.id}" aria-label="Удалить">×</button></div>`).join("")+(nOpen===l.k?noteForm(l):"")+"</div>"}
const brk=(a,b)=>b.a-a.b>0?`<div class="brk">${b.n-a.n===1?"перемена":"окно"} · ${fmt(b.a-a.b)}</div>`:"";
function dayHtml(d,even){const now=new Date(),ls=lessons(d,even);
 let h=`<div class="dh"><b>${DN[d.getDay()]}</b><span>${d.getDate()} ${MS[d.getMonth()]}</span>${O[dk(d)]?'<em class="rp">замена</em>':""}${d.toDateString()===now.toDateString()?'<em>сегодня</em>':""}</div>`;
 
 const td=d.toDateString()===now.toDateString();return h+(ls.length?ls.map((l,i)=>(i?brk(ls[i-1],l):"")+row(l,now)).join("")+(td&&ls.every(l=>l.b<=now)?'<div class="empty">На сегодня пары закончились</div>':""):'<div class="empty">'+(td?"Сегодня пар нет":"Пар нет")+'</div>')}
function view(){if(tab==="edit")return editView();if(tab==="login")return loginView();if(!hasData()){$("view").innerHTML='<div class="empty">Расписание недоступно. Попробуй обновить страницу.</div>';return}const now=new Date();let h="";
 if(tab==="today"){h=dayHtml(now)}
 else if(tab==="week"){const m=mon(now);m.setDate(m.getDate()+off*7);const ev=isEven(m);
  h=`<div class="nav"><button data-o="-1"${off<=base?" disabled":""}>←</button><span class="par">${m.getDate()} ${MS[m.getMonth()]} · ${ev?"чётная":"нечётная"}</span><button data-o="1">→</button></div>`;
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());for(let i=0;i<5;i++){const d=new Date(m);d.setDate(m.getDate()+i);if(d<t0)continue;h+=dayHtml(d,ev)}}
 else{const a={};let tp=0,ta=0;for(const k in att){const[ds,n]=k.split("|"),[y,mo,da]=ds.split("-"),d=new Date(+y,mo-1,+da);const l=lessons(d).find(x=>x.n==n);if(!l)continue;
   a[l.name]=a[l.name]||{p:0,a:0};a[l.name][att[k]]++;att[k]==="p"?tp++:ta++}
  const keys=Object.keys(a).sort();
  h=`<div class="hero"><small>Всего отмечено ${tp+ta}</small><b>${tp+ta?Math.round(tp/(tp+ta)*100):0}% посещаемость</b><p>был ${tp} · пропущено ${ta}</p></div>`+
   (keys.length?keys.map(n=>{const x=a[n],t=x.p+x.a;return `<div class="st"><span class="n">${n}</span><span class="r">${x.p} из ${t}</span><div class="bar"><span style="width:${x.p/t*100}%"></span></div></div>`}).join(""):'<div class="empty">Отмечай «был» и «нет» у пар, и тут появится статистика</div>')}
 $("view").innerHTML=h}
let canEdit=false,ED=null,edDay=1,edW=0,edS=0,edN="",edR="",msg="";const WS=["","Пн","Вт","Ср","Чт","Пт"];
const esc=v=>String(v).replace(/"/g,"&quot;").replace(/</g,"&lt;");
const clone=o=>JSON.parse(JSON.stringify(o));
function renderTabs(){const T=[["today","Сегодня"],["week","Неделя"]];if(canEdit)T.push(["edit","Редактирование"]);$("tabs").innerHTML=T.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join("");tabs();$("lg").style.display=canEdit?"none":""}
function keep(){const a=$("ns");if(a){edN=a.value;edR=$("nr").value}}
const MN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"],WA=["вс","пн","вт","ср","чт","пт","сб"];
let edD=null,edM=null,DR=null;
const saveLocal=()=>{try{localStorage.setItem("S",JSON.stringify(S));localStorage.setItem("O",JSON.stringify(O))}catch(e){}};
const keyDate=k=>{const[y,m,d]=k.split("-");return new Date(+y,m-1,+d)};
const effective=dt=>O[dk(dt)]||S[dt.getDay()].map(p=>p[isEven(dt)?0:1]||0);
function calHtml(){const y=edM.getFullYear(),m=edM.getMonth(),last=new Date(y,m+1,0).getDate(),first=(new Date(y,m,1).getDay()+6)%7,t0=new Date();t0.setHours(0,0,0,0);
 let h=`<div class="nav"><button data-ed="mon" data-v="-1">←</button><span class="par">${MN[m]} ${y}</span><button data-ed="mon" data-v="1">→</button></div><div class="cal">`;
 for(let i=0;i<first;i++)h+="<i></i>";
 for(let d=1;d<=last;d++){const dt=new Date(y,m,d),k=dk(dt),off=dt.getDay()%6===0||dt<t0;
  h+=`<button class="cd${k===edD?" on":""}${O[k]?" ov":""}" ${off?"disabled":`data-ed="pick" data-v="${k}"`}><b>${d}</b><small>${WA[dt.getDay()]}</small></button>`}
 return h+"</div>"}
function editView(){if(!edD){const t=new Date();while(t.getDay()%6===0)t.setDate(t.getDate()+1);edD=dk(t)}
 const dt=keyDate(edD);if(!edM)edM=new Date(dt.getFullYear(),dt.getMonth(),1);
 if(!DR)DR=effective(dt).map(c=>c?[c[0],c[1]]:["",""]);
 const tm=TM[dt.getDay()===1?1:"o"];
 let h=calHtml()+`<div class="dh" style="margin-top:22px"><b>${DN[dt.getDay()]}</b><span>${dt.getDate()} ${MS[dt.getMonth()]}</span>${O[edD]?'<em class="rp">замена</em>':""}</div><div class="info" style="padding-top:2px">Правка действует только на этот день</div>`;
 DR.forEach((c,i)=>{h+=`<div class="les" style="grid-template-columns:minmax(0,1fr);padding-left:0"><div class="t"><i>${i+1} пара · ${tm[i][0]}–${tm[i][1]}</i></div><div style="display:flex;gap:6px"><input data-s="${i}" data-f="0" value="${esc(c[0])}" placeholder="Название"><input data-s="${i}" data-f="1" value="${esc(c[1])}" placeholder="Каб." style="max-width:72px"></div></div>`});
 h+=`<button class="save" data-ed="save" style="margin-top:14px">Заменить</button>`+(O[edD]?`<button class="save" data-ed="reset" style="margin-top:8px">Вернуть обычное расписание</button>`:"")+`<div class="info" style="margin-top:8px">${msg}</div><button class="cp" data-ed="logout" style="margin-top:14px">Выйти</button>`;
 $("view").innerHTML=h}
async function commit(O2,ok){try{const u=await put({t:S,o:O2});O=O2;saveLocal();upd=u;try{localStorage.setItem("SU",u)}catch(e){}showUpd();DR=null;msg=ok}catch(x){msg="Не удалось сохранить. Попробуй выйти и войти заново"}view();hero()}
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.s===undefined||!DR)return;const c=DR[+t.dataset.s]||["",""];c[+t.dataset.f]=t.value;DR[+t.dataset.s]=c});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-ed]");if(!b)return;const a=b.dataset.ed;
 if(a==="loginview"){tab="login";tabs();view()}
 else if(a==="logout"){logout()}
 else if(a==="pick"){edD=b.dataset.v;DR=null;msg="";view()}
 else if(a==="mon"){edM=new Date(edM.getFullYear(),edM.getMonth()+ +b.dataset.v,1);view()}
 else if(a==="save"){const dt=keyDate(edD),rows=DR.map(c=>c&&c[0].trim()?[c[0].trim(),(c[1]||"").trim()]:0),base=S[dt.getDay()].map(p=>p[isEven(dt)?0:1]||0),O2=clone(O);
  if(JSON.stringify(rows)===JSON.stringify(base))delete O2[edD];else O2[edD]=rows;
  await commit(O2,"Сохранено только на "+dt.getDate()+" "+MS[dt.getMonth()])}
 else if(a==="reset"){const O2=clone(O);delete O2[edD];await commit(O2,"Вернул обычное расписание на этот день")}});
let NT=[];try{NT=JSON.parse(localStorage.getItem("N")||"[]")}catch(e){}
let nOpen=null,nType="n",nOff=10,nTxt="";
const saveN=()=>{try{localStorage.setItem("N",JSON.stringify(NT))}catch(e){}};
const lessonOf=k=>{const[ds,n]=k.split("|");return lessons(keyDate(ds)).find(y=>y.n==n)};
function askNotif(){try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}}
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),12000)}
function checkRem(){const now=Date.now();let ch=false;
 for(const x of NT){if(x.t!=="r"||x.f||x.at>now)continue;x.f=1;ch=true;if(x.at<now-108e5)continue;
  const l=lessonOf(x.k),m=x.x+(l?" · "+l.name:"");toast("Напоминание: "+m);
  try{if("Notification" in window&&Notification.permission==="granted")new Notification("Напоминание",{body:m})}catch(e){}}
 if(ch){saveN();if(!nOpen)view()}}
document.addEventListener("input",e=>{if(e.target.id==="nx")nTxt=e.target.value});
document.addEventListener("click",e=>{const b=e.target.closest("[data-n]");if(!b)return;const a=b.dataset.n,v=b.dataset.v;
 if(a==="open"){nOpen=nOpen===v?null:v;nType="n";nOff=10;nTxt="";view()}
 else if(a==="type"){nType=v;view()}
 else if(a==="cancel"){nOpen=null;view()}
 else if(a==="del"){NT=NT.filter(x=>String(x.id)!==v);saveN();view()}
 else if(a==="save"){const x=($("nx").value||"").trim(),ne=$("ne");if(!x){ne.textContent="Впиши текст заметки";return}
  let at=null;if(nType==="r"){nOff=+$("no").value;const l=lessonOf(v);if(!l)return;at=nOff===-1?l.b.getTime()-6e5:l.a.getTime()-nOff*6e4;if(at<=Date.now()){ne.textContent="Это время уже прошло";return}}
  NT.push({id:Date.now(),k:v,t:nType,x,at,f:0});saveN();const r=nType==="r";nOpen=null;nTxt="";view();if(r)askNotif()}});
let tok=null,rt=null,rem=false;
const stores=()=>{const a=[];try{a.push(localStorage)}catch(e){}try{a.push(sessionStorage)}catch(e){}return a};
const getS=k=>{for(const st of stores()){try{const v=st.getItem(k);if(v)return v}catch(e){}}return null};
function setTok(t,r,remember){rem=remember;stores().forEach(st=>{try{st.removeItem("tok");st.removeItem("rt")}catch(e){}});try{const st=remember?localStorage:sessionStorage;st.setItem("tok",t);st.setItem("rt",r||"")}catch(e){}tok=t;rt=r}
tok=getS("tok");rt=getS("rt");try{rem=!!localStorage.getItem("tok")}catch(e){}
if(!DEMO&&tok==="demo"){tok=null;rt=null}
function logout(){stores().forEach(st=>{try{st.removeItem("tok");st.removeItem("rt")}catch(e){}});tok=null;rt=null;canEdit=false;ED=null;renderTabs();tab="today";tabs();view()}
async function refresh(){try{const r=await fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:rt})});const j=await r.json();if(!j.access_token)return false;setTok(j.access_token,j.refresh_token,rem);return true}catch(e){return false}}
async function put(cl){const ts=new Date().toISOString();if(DEMO)return ts;const go=()=>fetch(SB_URL+"/rest/v1/schedule?id=eq.1",{method:"PATCH",headers:{apikey:SB_KEY,Authorization:"Bearer "+tok,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify({data:cl,updated_at:ts})});let r=await go();if(r.status===401&&await refresh())r=await go();if(!r.ok)throw 0;const j=await r.json();if(!j.length)throw 0;return j[0].updated_at||ts}
async function load(){try{const r=await fetch(SB_URL+"/rest/v1/schedule?id=eq.1&select=data,updated_at",{headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}});const j=await r.json();if(j[0]&&j[0].data){if(j[0].updated_at){upd=j[0].updated_at;try{localStorage.setItem("SU",upd)}catch(e){}showUpd()}{const dd=j[0].data;if(dd.t){S=dd.t;O=dd.o||{}}else{S=dd;O={}}}saveLocal();hero();if(tab!=="edit"&&tab!=="login")view()}}catch(e){}}
function loginView(){$("view").innerHTML=`<form class="lf" id="lf"><div class="day">Вход для редактора</div><input id="em" type="text" placeholder="Логин" autocomplete="username" autocapitalize="off" autocorrect="off"><input id="pw" type="password" placeholder="Пароль" autocomplete="current-password"><label class="rem"><input type="checkbox" id="rm" checked>Запомнить меня</label><button class="save" id="lb" type="submit">Войти</button><div class="info" id="lm">${DEMO?"Демо-режим: база не подключена, подойдут любые логин и пароль, правки хранятся только на этом устройстве.":""}</div></form>`}
async function doLogin(){const em=$("em").value.trim(),pw=$("pw").value,remember=$("rm").checked,lm=$("lm"),bt=$("lb");
 if(!em||!pw){lm.textContent="Введи логин и пароль";return}
 bt.disabled=true;bt.textContent="Входим…";lm.textContent="";
 try{
  if(DEMO)setTok("demo","",remember);
  else{const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:em,password:pw})});
   if(r.status>=400&&r.status<500){lm.textContent="Неверный логин или пароль";bt.disabled=false;bt.textContent="Войти";return}
   const j=await r.json();if(!j.access_token)throw 0;setTok(j.access_token,j.refresh_token,remember)}
  canEdit=true;renderTabs();tab="edit";tabs();view()
 }catch(x){lm.textContent="Нет соединения. Попробуй ещё раз";bt.disabled=false;bt.textContent="Войти"}}
document.addEventListener("submit",e=>{e.preventDefault();doLogin()});
let upd=null;try{upd=localStorage.getItem("SU")}catch(e){}
function showUpd(){const el=$("upd");if(!el)return;const d=upd?new Date(upd):null;el.textContent=d&&!isNaN(d)?"Расписание обновлено "+d.getDate()+" "+MS[d.getMonth()]+", "+pad(d.getHours())+":"+pad(d.getMinutes()):""}
async function init(){showUpd();checkRem();setInterval(checkRem,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkRem()});canEdit=!!tok;renderTabs();if(!DEMO){load();setInterval(load,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()})}}
function tabs(){document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab))}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.t){tab=b.dataset.t;tabs();view()}
 else if(b.dataset.o){off+=+b.dataset.o;view()}
 else if(b.dataset.k){const k=b.dataset.k,v=b.dataset.v;att[k]===v?delete att[k]:att[k]=v;save();view()}});
renderTabs();hero();view();setInterval(hero,30000);init();
</script>
</body>
</html>
